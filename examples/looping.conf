# Example configuration with self-replenishing cycle
# This demonstrates a cyclic process where outputs feed back as inputs

# Stocks - Starting resources to kickstart the cycle
water:10
seeds:5
fertilizer:3
energy:20

# Processes - 3+ processes forming a self-replenishing chain
farming:(water:2;seeds:1):(crops:3;seeds:1):30
processing:(crops:2):(food:1;fertilizer:1):20
composting:(food:1;water:1):(fertilizer:2;water:1):15
energy_gen:(crops:1):(energy:3):10

# Optimize for maximum food production
optimize:(food)
