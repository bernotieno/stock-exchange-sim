# Example configuration where resources eventually run out
# This demonstrates a finite resource scenario with 4 processes

# Stocks - Limited starting resources
iron_ore:20
coal:15
wood:10
stone:8

# Processes - 4 processes that consume resources
mining:(coal:1):(iron_ore:3):10
smelting:(iron_ore:2;coal:1):(iron_ingot:1):15
crafting:(iron_ingot:1;wood:2):(tool:1):20
building:(tool:1;stone:2;wood:1):(structure:1):25

# Optimize for time - finish as quickly as possible
optimize:(time)
